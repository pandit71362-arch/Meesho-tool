<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-com Profit Analyzer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; max-width: 500px; margin: 50px auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { width: 95%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #1557b0; }
        .result-box { margin-top: 25px; padding: 15px; background-color: #e8f0fe; border-radius: 8px; text-align: left; }
        .success { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📦 E-com Analyzer</h1>
        <p>Check product market trends instantly</p>
        <form method="POST">
            <input type="text" name="product" placeholder="Product Name (e.g., Kurti, Watch)" required>
            <input type="number" name="price" placeholder="Your Selling Price (₹)" required>
            <button type="submit">Analyze Now</button>
        </form>

        {% if result %}
            <div class="result-box">
                {% if result.status == "Success" %}
                    <p class="success">✅ Analysis Complete!</p>
                    <p><strong>Product:</strong> {{ result.product }}</p>
                    <p><strong>Trend:</strong> {{ result.market_trend }} 📈</p>
                    <p><strong>Advice:</strong> {{ result.advice }}</p>
                {% else %}
                    <p style="color: red;">❌ {{ result.message }}</p>
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
